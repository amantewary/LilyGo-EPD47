; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = boards
src_dir = examples/ha_calendar

[env]
lib_extra_dirs = ${PROJECT_DIR}
platform = espressif32@6.5.0
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags = 
	-DBOARD_HAS_PSRAM
	
	-DARDUINO_USB_CDC_ON_BOOT=1
	
	
	
	-DCORE_DEBUG_LEVEL=0
monitor_filters = 
	default
	esp32_exception_decoder
lib_deps = 
	lewisxhe/SensorLib @ 0.3.1
	lennarthennigs/Button2 @ 2.3.2
	Wire
	SPI

[env:T5-ePaper-S3]
extends = env
board = T5-ePaper-S3
build_flags = ${env.build_flags}
	-DLILYGO_T5_EPD47_S3
lib_deps = bblanchon/ArduinoJson@^7.4.2

[env:T5-ePaper-S3-OTA]
extends = env:T5-ePaper-S3
upload_protocol = espota
upload_port = 192.168.2.89  ; Change this to your device's IP address after first upload
upload_flags = 
	--auth=epd47ota  ; OTA password (must match the password in ha_calendar.ino)
; Note: For OTA to work, you need to:
; 1. First upload via USB to get the device on WiFi
; 2. Check serial monitor to see the IP address
; 3. Update upload_port above with the actual IP
; 4. Then use: pio run -e T5-ePaper-S3-OTA -t upload
